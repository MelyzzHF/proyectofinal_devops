version: '3.9'

services:
  flask-app:
    build: .
    container_name: api-service
    networks:
      - mi-red-devops

  nginx-proxy:
    image: nginx:alpine
    container_name: web-proxy
    ports:
      - "80:80"
    networks:
      - mi-red-devops
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask-app

networks:
  mi-red-devops:
    driver: bridge
